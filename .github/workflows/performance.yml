name: performance-guardrails

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  harness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genelife
          POSTGRES_PASSWORD: genelife
          POSTGRES_DB: genelife_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genelife -d genelife_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=genelife_dev;Username=genelife;Password=genelife
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Genelife.Performance.Tests/Genelife.Performance.Tests.csproj --nologo

      - name: Run load harness and guardrails
        run: >
          dotnet run --project Genelife.Performance.Tests/Genelife.Performance.Tests.csproj
          --no-build --no-launch-profile --
          -class Genelife.UnitTests.Performance.LoadHarness
          -class Genelife.UnitTests.Performance.PerformanceGuardrailTests
          -class Genelife.UnitTests.Performance.FamilyPerformanceTests
          -class Genelife.UnitTests.Performance.MultiplayerAcceptanceTests
          -class Genelife.UnitTests.Economy.BalanceScenarioTests
          -class Genelife.UnitTests.Family.ReplayTests
          -class Genelife.UnitTests.Release.FamilyReleaseScenarioTests

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: |
            **/performance-reports/*.json
            **/release-reports/*.json
            **/balance-reports/*.json
          if-no-files-found: warn

      - name: Publish report summary
        if: always()
        run: |
          echo "## Performance guardrails" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          find . -path "*/performance-reports/*.json" -maxdepth 8 | sort | while read -r report; do
            echo "### ${report}" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
