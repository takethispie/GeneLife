name: ci

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore GeneLife.sln
      - run: dotnet build Genelife.Domain.Tests/Genelife.Domain.Tests.csproj -c Release --no-restore
      - run: >
          dotnet run --project Genelife.Domain.Tests/Genelife.Domain.Tests.csproj
          -c Release --no-build --no-launch-profile --
          -trait- "Category=Scenario"

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genelife
          POSTGRES_PASSWORD: genelife
          POSTGRES_DB: genelife_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genelife -d genelife_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=genelife_dev;Username=genelife;Password=genelife
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore GeneLife.sln
      - run: dotnet build Genelife.Api.IntegrationTests/Genelife.Api.IntegrationTests.csproj -c Release --no-restore
      - run: >
          dotnet run --project Genelife.Api.IntegrationTests/Genelife.Api.IntegrationTests.csproj
          -c Release --no-build --no-launch-profile

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: clients/browser/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/fixture-smoke.spec.ts
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_START_DEV: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: browser-client-dist
          path: clients/browser/dist
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: clients/browser/playwright-report
          retention-days: 7

  admin-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: clients/browser/package-lock.json
      - run: dotnet build Genelife.Web/Genelife.Web.csproj -c Release
        working-directory: ${{ github.workspace }}
      - run: npm ci
      - run: npm run check:admin-fixtures
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:admin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-admin
          path: clients/browser/playwright-report-admin
          if-no-files-found: ignore
          retention-days: 7
