name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genelife
          POSTGRES_PASSWORD: genelife
          POSTGRES_DB: genelife_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genelife -d genelife_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=genelife_dev;Username=genelife;Password=genelife
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore GeneLife.sln
      - run: dotnet build GeneLife.sln -c Release --no-restore
      - run: dotnet run --project Genelife.UnitTests/Genelife.UnitTests.csproj -c Release --no-build --no-launch-profile
