services:
  postgres:
    image: postgres:16
    container_name: genelife-postgres
    environment:
      POSTGRES_USER: genelife
      POSTGRES_PASSWORD: genelife
      POSTGRES_DB: genelife_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genelife -d genelife_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
